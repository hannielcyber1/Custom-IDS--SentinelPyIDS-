[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinelpy-ids"
version = "1.0.0"
description = "Modular Network Intrusion Detection System inspired by Snort and Suricata"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "hannielcyber1" }]
dependencies = [
    "scapy>=2.5.0",
    "pyyaml>=6.0",
    "pydantic>=2.0.0"
]

[project.scripts]
sentinelpy = "sentinelpy.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
