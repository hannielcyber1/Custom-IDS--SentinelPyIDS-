schema_version: 1

rules:
  - id: SPY-B1001
    name: Potential TCP Port Scan
    enabled: true
    category: reconnaissance
    severity: medium
    detector: unique_destination_ports
    scope:
      source: source_ip
      destination: destination_ip
      protocol: tcp
    window_seconds: 10
    threshold:
      minimum_unique_ports: 15
    description: >
      A source host contacted many distinct TCP destination ports on a target host within a short time window.
    tags:
      - reconnaissance
      - port_scan
      - behavioral

  - id: SPY-B1002
    name: ICMP Ping Sweep Detected
    enabled: true
    category: reconnaissance
    severity: low
    detector: icmp_echo_burst
    scope:
      source: source_ip
      protocol: icmp
    window_seconds: 60
    threshold:
      minimum_requests: 10
    description: >
      A single host sent multiple ICMP Echo Requests in a short window, indicative of a host discovery sweep.
    tags:
      - reconnaissance
      - ping_sweep
      - behavioral

  - id: SPY-B1003
    name: Excessive ARP Activity (Potential ARP Scan or Poisoning)
    enabled: true
    category: network_spoofing
    severity: medium
    detector: arp_request_burst
    scope:
      source: source_ip
      protocol: arp
    window_seconds: 60
    threshold:
      minimum_requests: 60
    description: >
      An excessive volume of ARP requests was generated by a single source, indicating potential scanning or cache poisoning.
    tags:
      - arp
      - mitm
      - behavioral

  - id: SPY-B1004
    name: SSH Connection Burst (Potential Brute Force)
    enabled: true
    category: credential_access
    severity: high
    detector: port_connection_burst
    scope:
      source: source_ip
      destination_port: 22
      protocol: tcp
    window_seconds: 60
    threshold:
      minimum_connections: 3
    description: >
      Rapid repeated TCP connection attempts to SSH port 22 were observed from a single source IP.
    tags:
      - ssh
      - brute_force
      - behavioral
